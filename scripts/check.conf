# scripts/check.conf — Notes&MJ (Python 3.12 · uv · PySide6 · sqlite3)
# Format: <name>: <command> — runs in order, fails fast. [fast] in the NAME = also in --fast.
# Resource hygiene inventory (docs/testing.md): uv, ruff, mypy and pytest are run-once processes —
# no daemon (never dmypy, never ruff --watch, never pytest-xdist). The UI step adds a QApplication,
# created and torn down by pytest-qt; no window is shown (offscreen platform).
# resource hygiene: no lock/env mutation during check (--frozen: use uv.lock as-is, no resolve)

lock [fast]: uv lock --check
lint [fast]: uv run --frozen ruff check .
format [fast]: uv run --frozen ruff format --check .
types [fast]: uv run --frozen mypy

# Split by selector, never by list (docs/testing.md rule 4): "not ui" ∪ "ui" = every test.
# Module boundary rules run here too (tests/architecture_rules.py; docs/architecture.md).
test-unit-integration [fast]: uv run --frozen pytest -m "not ui" -p no:cacheprovider
# resource hygiene: offscreen platform — the UI tests open no window, and pytest-qt owns the
# QApplication, tearing it down at the end of the run including on failure and timeout.
test-ui: QT_QPA_PLATFORM=offscreen uv run --frozen pytest -m ui -p no:cacheprovider
