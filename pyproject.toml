[project]
name = "notes-mj"
version = "0.1.0"
description = "Notes&MJ — yerel masaüstü iş planlayıcı, odak modu ve not aracı"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "grimp>=3.17",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Python only: ruff also formats Markdown code blocks, which would rewrite ANEW core docs.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "SIM", "RUF"]
# User-facing text is Turkish (docs/conventions.md): dotless/dotted I are letters, not confusables.
allowed-confusables = ["ı", "İ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = ["ui: Qt user-interface tests (full profile only)"]
